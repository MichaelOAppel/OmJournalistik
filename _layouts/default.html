<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body { font-family: Georgia, serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    nav a { margin-right: 1rem; }
        img { max-width: 100%; height: auto; display: block; margin: 1rem 0; }
    table.karakterskala { border-collapse: collapse; width: 100%; }
      table.karakterskala td { border: 1px solid #333; vertical-align: middle; }
      table.karakterskala td:first-child { text-align: right; padding: 0.4em 0.7em 0.4em 0.4em; white-space: nowrap; font-weight: bold; }
      table.karakterskala td:nth-child(2) { text-align: center; padding: 0.4em 0.8em; }
      table.karakterskala td:nth-child(3) { padding: 0.4em 0.6em; }
      h1 { font-size: 1.35em; font-weight: bold; line-height: 1.3; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Forside</a>
    <a href="{{ '/jargon/' | relative_url }}">Jargon</a>
    <a href="{{ '/karakterskala/' | relative_url }}">Karakterskala</a>
    <a href="{{ '/om/' | relative_url }}">Om</a>
  </nav>
  {% if page.collection == "posts" %}
    <h1>[{{ page.karakter }}] {{ page.medie }}: “{{ page.title }}”</h1>
    {% endif %}
    {{ content }}
</body>
</html>
