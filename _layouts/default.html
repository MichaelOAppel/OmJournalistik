<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Source+Sans+3:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    .undertitel { text-align: center; }
    body { font-family: "Source Sans 3", sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      h1, h2, h3 { font-family: "Roboto Slab", serif; }
      h1 { font-size: 1.6em; font-weight: 700; line-height: 1.3; text-align: center; }
        h1.anmeldelse { font-size: 1.35em; text-align: left; }
      nav a { margin-right: 1rem; }
        img { max-width: 100%; height: auto; display: block; margin: 1rem 0; }
    table.karakterskala { border-collapse: collapse; width: 100%; }
      table.karakterskala td { border: 1px solid #333; vertical-align: middle; }
      table.karakterskala td:first-child { text-align: right; padding: 0.4em 0.7em 0.4em 0.4em; white-space: nowrap; font-weight: bold; }
      table.karakterskala td:nth-child(2) { text-align: center; padding: 0.4em 0.8em; }
      table.karakterskala td:nth-child(3) { padding: 0.4em 0.6em; }
      h1 { font-size: 1.35em; font-weight: bold; line-height: 1.3; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Forside</a>
    <a href="{{ '/jargon/' | relative_url }}">Jargon</a>
    <a href="{{ '/karakterskala/' | relative_url }}">Karakterskala</a>
    <a href="{{ '/om/' | relative_url }}">Om</a>
  </nav>
  {% if page.collection == "posts" %}
    <h1 class="anmeldelse">[{{ page.karakter }}] {{ page.medie }}: “{{ page.title }}”</h1>
    {% endif %}
    {{ content }}
</body>
</html>
